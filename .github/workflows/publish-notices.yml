name: 공지 자동 게시
on:
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-notices.yml
      - scripts/**
      - legacy-notices.json
      - publishers.json
permissions:
  contents: write
  issues: read
# 게시할 때마다 모든 공지를 다시 만들므로 마지막 실행만 있으면 됩니다.
# 글 작성과 라벨 추가가 동시에 실행을 두 번 만들 때 앞 실행을 기다리지 않고 바로 취소합니다.
concurrency:
  group: notice-publisher
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 공지 저장소 읽기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, MIT / https://github.com/actions/checkout
        with:
          ref: main
      # 게시글 작성·수정 때는 도구를 미리 준비하지 않습니다. 새 사진이나 영상·음성을 처리할 때만 스크립트가 필요한 도구를 설치합니다.
      # 변환 스크립트를 바꿔 푸시할 때만 도구를 모두 설치하고 검증합니다.
      - name: 검증 도구 준비
        if: github.event_name == 'push'
        run: |
          command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 -m venv "$RUNNER_TEMP/notice-tools"
          "$RUNNER_TEMP/notice-tools/bin/python" -m pip install -q -r scripts/requirements.txt
          echo "$RUNNER_TEMP/notice-tools/bin" >> "$GITHUB_PATH"
      - name: 공지 변환 검증
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: 게시글에서 게임 공지 생성
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTICE_INSTALL_TOOLS: '1'
        run: python3 scripts/publish_notices.py
      - name: 변경된 공지 반영
        shell: bash
        run: |
          if test -z "$(git status --porcelain -- notices.json images/generated)"; then
            echo '공지 변경이 없습니다.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notices.json images/generated
          git commit -m '공지 게시글 변경 자동 반영'
          git push origin HEAD:main
